name: Nexus Front Door Lab

on:
  push:
    branches: ['lab-e2e-frontdoor-*', 'integration/nexus-unified-candidate-*']
    paths:
      - 'nexus/frontdoor.py'
      - 'nexus/adapters/languagetool.py'
      - 'nexus/schemas/frontdoor_rules.json'
      - 'nexus/frontdoor_rules.json'
      - 'nexus/tests/test_frontdoor_prefixes.py'
      - 'nexus/tests/test_frontdoor_natural.py'
      - 'nexus/tests/test_frontdoor_languagetool_shadow.py'
      - 'nexus/tests/test_frontdoor_adversarial.py'
      - 'nexus/tests/test_frontdoor_boundaries.py'
      - 'nexus/tests/test_final_candidate_guards.py'
      - 'nexus/tests/test_frontdoor_host_boundary.py'
      - 'nexus/tests/test_frontdoor_preexecution_gate.py'
      - 'nexus/app.py'
      - 'nexus/ui/app.js'
      - 'nexus/ui/style.css'
      - 'nexus/tests/test_folha_interpret.py'
      - 'nexus/tests/test_folha_writer_preexecution.py'
      - 'nexus/tests/test_generic_folha_gate.py'
      - 'nexus/capability_router.py'
      - 'nexus/tests/folha_revision_smoke.cjs'
      - 'nexus/ui/index.html'
      - 'nexus/docs/PLANO-TESTES-FRONTDOOR-10000-2026-10-04.md'
      - '.github/workflows/frontdoor-lab.yml'
  pull_request:
    paths:
      - 'nexus/frontdoor.py'
      - 'nexus/frontdoor_rules.json'
      - 'nexus/schemas/frontdoor_rules.json'
      - 'nexus/app.py'
      - 'nexus/ui/app.js'
      - 'nexus/ui/style.css'
      - 'nexus/tests/test_folha_interpret.py'
      - 'nexus/tests/test_folha_writer_preexecution.py'
      - 'nexus/tests/test_generic_folha_gate.py'
      - 'nexus/capability_router.py'
      - 'nexus/tests/folha_revision_smoke.cjs'
      - 'nexus/ui/index.html'
      - 'nexus/tests/test_frontdoor_prefixes.py'
      - 'nexus/tests/test_frontdoor_host_boundary.py'
      - 'nexus/tests/test_frontdoor_preexecution_gate.py'
      - '.github/workflows/frontdoor-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l0:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Active Front Door SHA-256
        run: >-
          python -c "import hashlib,json,pathlib;
          p=['nexus/app.py','nexus/host.py','nexus/frontdoor.py','nexus/frontdoor_rules.json','nexus/schemas/frontdoor_rules.json','nexus/ui/index.html','nexus/ui/app.js'];
          print('FRONTDOOR_SHA256='+json.dumps({x.split('nexus/',1)[1]:hashlib.sha256(pathlib.Path(x).read_bytes()).hexdigest() for x in p},sort_keys=True))"
      - name: Folha JavaScript parse + edit revision guards
        run: |
          node --check nexus/ui/app.js
          node nexus/tests/folha_revision_smoke.cjs
      - name: Folha read-only seven-intent API gates
        run: python -m pytest nexus/tests/test_folha_interpret.py nexus/tests/test_folha_writer_preexecution.py nexus/tests/test_generic_folha_gate.py nexus/tests/test_generic_capability_router.py -q -o pythonpath=.
      - name: L0 prefix parser
        run: python -m pytest nexus/tests/test_frontdoor_prefixes.py -q -o pythonpath=.
      - name: L1 L2 natural and ambiguity
        run: python -m pytest nexus/tests/test_frontdoor_natural.py -q -o pythonpath=.
      - name: L3 LanguageTool shadow
        run: python -m pytest nexus/tests/test_frontdoor_languagetool_shadow.py -q -o pythonpath=.
      - name: L3 adversarial
        run: python -m pytest nexus/tests/test_frontdoor_adversarial.py -q -o pythonpath=.
      - name: L4 boundaries and malformed
        run: python -m pytest nexus/tests/test_frontdoor_boundaries.py -q -o pythonpath=.
      - name: Candidate convergence refusal and C1 boundary gates
        run: python -m pytest nexus/tests/test_final_candidate_guards.py -q -o pythonpath=.
      - name: Host boundary and pre-execution human gate
        run: python -m pytest nexus/tests/test_frontdoor_host_boundary.py nexus/tests/test_frontdoor_preexecution_gate.py -q -o pythonpath=.
