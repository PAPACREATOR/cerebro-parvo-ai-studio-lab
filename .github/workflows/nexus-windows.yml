name: Nexus Windows

on:
  push:
    branches: [main, 'work/**', 'nexus-startup-*']
    paths: ['nexus/**', '.github/workflows/nexus-windows.yml']
  pull_request:
    paths: ['nexus/**', '.github/workflows/nexus-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nexus:
    name: Nexus atual — Windows, contratos e arranque
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Instalar dependencias Nexus fixadas
        shell: pwsh
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Gate de runtime local permitido
        shell: pwsh
        run: python -m pytest nexus/tests/test_no_forbidden_legacy_runtime.py -q -p no:cacheprovider -o pythonpath=.
      - name: Script PowerShell 5 - suites Lab e falha diagnosticada
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          python -m pytest nexus/tests/test_windows_stack_structural_300k.py -q -p no:cacheprovider -o pythonpath=.
          if ($LASTEXITCODE -ne 0) { throw '300K structural compatibility gate failed' }
          Write-Output 'NEXUS_STRUCTURAL_300000=PASS'
          foreach ($suite in @('core', 'blocks', 'practical')) {
            $report = Join-Path $env:RUNNER_TEMP ('nexus-' + $suite)
            powershell.exe -NoProfile -File nexus/windows/check-nexus.ps1 -PythonPath $python -Suite $suite -ReportDirectory $report
            if ($LASTEXITCODE -ne 0) {
              Get-ChildItem -LiteralPath $report -Filter '*.txt' | ForEach-Object { Get-Content -LiteralPath $_.FullName }
              throw "Suite $suite failed"
            }
            $state = Get-Content (Join-Path $report 'state.json') -Raw | ConvertFrom-Json
            if ($state.status -ne 'PASS' -or $state.suite -ne $suite) { throw "Missing PASS report for $suite" }
            $stage = 'TESTS-' + $suite.ToUpperInvariant()
            Get-Content (Join-Path $report ($stage + '.stdout.txt'))
            Write-Output ("NEXUS_SUITE_" + $suite.ToUpperInvariant() + "=PASS")
          }
          $bad = Join-Path $env:RUNNER_TEMP 'nexus-fail'
          powershell.exe -NoProfile -File nexus/windows/check-nexus.ps1 -PythonPath 'NEXUS-MISSING-PYTHON.exe' -ReportDirectory $bad
          if ($LASTEXITCODE -eq 0) { throw 'Missing Python was accepted' }
          $failure = Get-Content "$bad/state.json" -Raw | ConvertFrom-Json
          if ($failure.status -ne 'FAIL' -or -not $failure.error) { throw 'Missing failure diagnosis' }
          Write-Output 'POWERSHELL_WRAPPER=PASS (staged suites + missing executable)'
          exit 0
      - name: Delimitar evidencia
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Suites Nexus core, blocks e practical executadas num runner Windows; regressao integral nos jobs complementares. Practical cobre apenas contratos reais ja automatizados. Nao prova a instalacao no PC de Pedro, Open Notebook/tiny, LibreOffice real, ACL da conta Nexus, homelab ou o produto completo.'

  regression:
    name: Nexus Windows — standard regression partition ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      NEXUS_REGRESSION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Nexus test dependencies
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Complete standard regression on the same candidate
        shell: pwsh
        run: |
          # Same standard coverage; six volume modules remain in dedicated gates.
          $volume = @(
            'nexus/tests/test_product_flows_5000.py',
            'nexus/tests/test_product_system_50000.py',
            'nexus/tests/test_product_themes_canonical_200k.py',
            'nexus/tests/test_public_product_routes_10000.py',
            'nexus/tests/test_public_product_routes_all_50000.py',
            'nexus/tests/test_windows_stack_structural_300k.py'
          )
          $modules = @(Get-ChildItem -LiteralPath nexus/tests -File -Recurse |
            Where-Object { $_.Name -like 'test_*.py' -or $_.Name -like '*_test.py' } |
            ForEach-Object { [IO.Path]::GetRelativePath($PWD.Path, $_.FullName).Replace('\', '/') } |
            Where-Object { $volume -notcontains $_ } | Sort-Object)
          $shard = [int]$env:NEXUS_REGRESSION_SHARD
          $selected = @(for ($i = 0; $i -lt $modules.Count; $i++) {
            if (($i % 2) -eq $shard) { $modules[$i] }
          })
          if ($selected.Count -eq 0) { throw 'Empty regression partition' }
          Write-Output ("STANDARD_MODULES=" + $modules.Count + " PARTITION=" + $shard + " SELECTED=" + $selected.Count)
          $selected | ForEach-Object { Write-Output ("STANDARD_MODULE=" + $_) }
          python -m pytest @selected -vv -p no:cacheprovider -o pythonpath=. --durations=20 "--junitxml=windows-regression-evidence/standard-$shard.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Standard Windows regression partition failed' }
          Write-Output ("NEXUS_SUITE_ALL_STANDARD_PARTITION_" + $shard + "=PASS")
      - name: Preserve complete regression evidence even on FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-standard-regression-evidence-${{ matrix.shard }}
          path: windows-regression-evidence/
          if-no-files-found: error
