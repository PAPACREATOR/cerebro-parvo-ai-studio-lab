name: Wiki Windows validation

on:
  push:
    branches: ['lab-wiki-complemento-*']
    paths:
      - 'nexus/lab/wiki/**'
      - '.github/workflows/wiki-windows-validation.yml'
  pull_request:
    paths:
      - 'nexus/lab/wiki/**'
      - '.github/workflows/wiki-windows-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixed Nexus test dependencies
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Wiki Kernel bridge on Windows
        run: python -m pytest nexus/lab/wiki/test_kernel_bridge.py -q -o pythonpath=.
      - name: Wiki 100K study on Windows
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'wiki-100k'
          python nexus/lab/wiki/test_web_research_wiki_100k.py --cases 100000 --output $out
          if ($LASTEXITCODE -ne 0) { throw 'Wiki 100K failed' }
          $summary = Get-Content (Join-Path $out 'summary.json') -Raw | ConvertFrom-Json
          if ($summary.status -ne 'PASS' -or $summary.object_cases_passed -ne 100000) {
            throw 'Wiki 100K summary is not PASS'
          }
          Write-Output ("WIKI_100K=PASS elapsed=" + $summary.elapsed_seconds)
      - name: Evidence scope
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Windows validation of the experimental read-only Wiki/Store bridge and 100000 synthetic object study. This does not prove official Host/UI/Human Gate integration or semantic quality.'
