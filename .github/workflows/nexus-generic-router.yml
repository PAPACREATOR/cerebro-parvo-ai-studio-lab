name: Nexus generic capability router lab

on:
  pull_request:
    paths:
      - 'nexus/capability_router.py'
      - 'nexus/tests/test_generic_capability_router.py'
      - '.github/workflows/nexus-generic-router.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing:
    name: Pure registry and fail-closed proposals (Windows and Linux)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Nexus tests
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Test N-adapter proposals and refusals
        run: python -m pytest -q -o pythonpath=. nexus/tests/test_generic_capability_router.py
