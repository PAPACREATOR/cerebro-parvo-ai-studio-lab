name: Open Notebook Avatar Lab
on:
  push:
    branches: ['lab-open-notebook-avatar-*']
    paths: ['nexus/lab/open_notebook_avatar/**', '.github/workflows/open-notebook-avatar.yml']
  pull_request:
    paths: ['nexus/lab/open_notebook_avatar/**', '.github/workflows/open-notebook-avatar.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: open-notebook-avatar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lfnovo/open-notebook
          ref: 315d5255af2a5132aada41c94d5c3c5dc8e837aa
          path: upstream-open-notebook
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install FFmpeg Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Use FFmpeg executable directly on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg\tools" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'FFmpeg executable missing' }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install native API and extension test dependencies
        run: python -m pip install jsonschema==4.26.0 -e upstream-open-notebook -e 'nexus/lab/open_notebook_avatar[test]'
      - name: Windows codec scope and tool timeout
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/upstream-open-notebook"
          python -m pytest nexus/lab/open_notebook_avatar/tests/test_avatar.py -k 'test_ffmpeg_cannot_read_unneeded_host_runtime or test_timeout or test_pipeline_reverse_idempotence_restart or test_avatar_worker_requires_real_native_boundary' -vv --durations=10 --junitxml=avatar-native-scope.xml
      - name: Extension contracts and real FFmpeg
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/upstream-open-notebook"
          python -m pytest nexus/lab/open_notebook_avatar/tests -vv --durations=10 --junitxml=avatar-tests.xml
      - name: Explain scope
        shell: bash
        run: echo 'Boundary tests use real FFmpeg and native auth; learned model substituted. Native CPU model acceptance has separate versioned evidence. No GPU or user-PC release claim.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avatar-tests-${{ matrix.os }}
          path: |
            avatar-tests.xml
            avatar-native-scope.xml
          if-no-files-found: error
