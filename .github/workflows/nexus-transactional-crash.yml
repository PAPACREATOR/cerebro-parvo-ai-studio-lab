name: Nexus transactional crash gate

on:
  pull_request:
    paths:
      - 'nexus/store.py'
      - 'nexus/tests/test_store_create_crash_real.py'
      - 'nexus/tests/test_canonical_crash_real.py'
      - '.github/workflows/nexus-transactional-crash.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-crash:
    name: Store create crash — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Real create and Canonical publication crash recovery
        run: python -m pytest nexus/tests/test_store_create_crash_real.py nexus/tests/test_canonical_crash_real.py -q -p no:cacheprovider -o pythonpath=.
