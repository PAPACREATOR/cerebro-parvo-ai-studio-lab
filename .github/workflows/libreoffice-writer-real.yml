name: LibreOffice Writer Real

on:
  push:
    branches: ['lab-open-notebook-avatar-*']
    paths:
      - 'nexus/adapters/office.py'
      - 'nexus/adapters/writer_sandy.py'
      - 'nexus/adapters/vendor/sandy/**'
      - 'nexus/tests/install-writer-ci.ps1'
      - 'nexus/host.py'
      - 'nexus/adapters/runner.py'
      - 'nexus/tests/test_office.py'
      - 'nexus/tests/test_writer_real_libreoffice.py'
      - 'nexus/tests/test_native_writer_route_real.py'
      - 'nexus/tests/fixtures/writer-fixed-test.ott'
      - 'nexus/docs/F007-LIBREOFFICE.md'
      - 'nexus/docs/CAPABILITY-WRITER-EDITORIAL.md'
      - '.github/workflows/libreoffice-writer-real.yml'
  pull_request:
    paths:
      - 'nexus/adapters/office.py'
      - 'nexus/adapters/writer_sandy.py'
      - 'nexus/adapters/vendor/sandy/**'
      - 'nexus/tests/install-writer-ci.ps1'
      - 'nexus/host.py'
      - 'nexus/adapters/runner.py'
      - 'nexus/tests/test_office.py'
      - 'nexus/tests/test_writer_real_libreoffice.py'
      - 'nexus/tests/test_native_writer_route_real.py'
      - 'nexus/tests/fixtures/writer-fixed-test.ott'
      - 'nexus/docs/F007-LIBREOFFICE.md'
      - 'nexus/docs/CAPABILITY-WRITER-EDITORIAL.md'
      - '.github/workflows/libreoffice-writer-real.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  writer:
    name: Real Writer ODT round-trip and PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXUS_REAL_WRITER: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install LibreOffice Writer from runner distribution
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          soffice --version
      - name: Install pytest
        run: python -m pip install pytest
      - name: Real LibreOffice Writer gate
        run: python -m pytest nexus/tests/test_writer_real_libreoffice.py -q -p no:cacheprovider -o pythonpath=.

  writer-windows:
    name: Real Writer Windows — fixed template round-trip
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NEXUS_REAL_WRITER: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install official verified Writer 26.2.6.2
        shell: pwsh
        run: ./nexus/tests/install-writer-ci.ps1
      - name: Verify Sandy v0.9994 release hash (lab pin)
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'sandy.exe'
          Invoke-WebRequest 'https://github.com/ahrvoje/sandy_cli/releases/download/v0.9994/sandy.exe' -OutFile $path
          if ((Get-Item $path).Length -ne 1159680) { throw 'Sandy release length mismatch' }
          if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'cbfc30709f80e63b201f1944c34692fc430d8aa42d6cd2823fcc670675307eac') { throw 'Sandy release SHA256 mismatch' }
          "SANDY_EXE=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned Nexus test dependencies
        run: python -m pip install -r nexus/requirements-test.txt
      - name: Real LibreOffice Writer Windows gate
        run: python -m pytest nexus/tests/test_writer_real_libreoffice.py nexus/tests/test_native_writer_route_real.py -q -rP -p no:cacheprovider -o pythonpath=. --junitxml=writer-evidence/native-writer.xml
      - name: Preserve native Writer observations even on FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-writer-evidence
          path: writer-evidence/
          if-no-files-found: error
